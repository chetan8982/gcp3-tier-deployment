name: Deploy Development
on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-deployment
  cancel-in-progress: false

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: node --check server.js

      - name: Run tests
        run: npm test --if-present

  deploy:
    name: Deploy to Development
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: development

    env:
      SSH_USER: ${{ secrets.SSH_USER }}
      BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
      FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          set -euo pipefail

          required_variables=(
            SSH_USER
            BACKEND_HOST
            FRONTEND_HOST
            SSH_PRIVATE_KEY
            MONGODB_URI
          )

          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Missing required secret: ${variable_name}"
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"

          touch "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

          ssh-keyscan \
            -T 10 \
            -H "${BACKEND_HOST}" \
            >> "${HOME}/.ssh/known_hosts"

          if [[ "${FRONTEND_HOST}" != "${BACKEND_HOST}" ]]; then
            ssh-keyscan \
              -T 10 \
              -H "${FRONTEND_HOST}" \
              >> "${HOME}/.ssh/known_hosts"
          fi

      - name: Verify backend SSH
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "${HOME}/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "${SSH_USER}@${BACKEND_HOST}" \
            "echo 'Backend SSH connection successful'"

      - name: Verify frontend SSH
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "${HOME}/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "${SSH_USER}@${FRONTEND_HOST}" \
            "echo 'Frontend SSH connection successful'"

      - name: Create backend environment file
        shell: bash
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          set -euo pipefail

          {
            echo "NODE_ENV=development"
            echo "PORT=5000"
            printf 'MONGODB_URI=%s\n' "${MONGODB_URI}"
            echo "ALLOWED_ORIGINS=http://${FRONTEND_HOST}"
          } > backend/.env

          chmod 600 backend/.env

      - name: Configure frontend API URL
        shell: bash
        run: |
          set -euo pipefail

          API_URL="http://${BACKEND_HOST}:5000/api/forms"

          if ! grep -qE \
            '^[[:space:]]*const API_URL[[:space:]]*=' \
            frontend/script.js; then
            echo "::error::Could not find const API_URL in frontend/script.js"
            exit 1
          fi

          sed -i \
            "s|^[[:space:]]*const API_URL[[:space:]]*=.*|const API_URL = \"${API_URL}\";|" \
            frontend/script.js

          grep -E \
            '^[[:space:]]*const API_URL[[:space:]]*=' \
            frontend/script.js

      - name: Prepare backend directory
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "${HOME}/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "${SSH_USER}@${BACKEND_HOST}" \
            "mkdir -p /opt/form-backend"

      - name: Deploy backend
        shell: bash
        run: |
          set -euo pipefail

          rsync \
            --archive \
            --compress \
            --delete \
            --exclude='node_modules/' \
            --exclude='.git/' \
            -e "ssh -i ${HOME}/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10" \
            backend/ \
            "${SSH_USER}@${BACKEND_HOST}:/opt/form-backend/"

      - name: Install and restart backend
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "${HOME}/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "${SSH_USER}@${BACKEND_HOST}" \
            'bash -se' <<'EOF'
          set -euo pipefail

          cd /opt/form-backend

          echo "Node version:"
          node --version

          echo "npm version:"
          npm --version

          echo "Installing production dependencies..."
          rm -rf node_modules
          npm ci --omit=dev

          echo "Verifying required modules..."
          node -e "
            require('express');
            require('mongoose');
            require('cors');
            require('dotenv');
            console.log('Backend dependencies are installed');
          "

          pm2 delete form-backend >/dev/null 2>&1 || true

          pm2 start server.js \
            --name form-backend \
            --cwd /opt/form-backend \
            --time

          pm2 save

          sleep 5

          pm2 status form-backend
          EOF

      - name: Backend health check
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "${HOME}/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "${SSH_USER}@${BACKEND_HOST}" \
            'bash -s' <<'EOF'
          HEALTH_URL="http://127.0.0.1:5000/health"

          for attempt in $(seq 1 12); do
            echo "Backend health-check attempt ${attempt}/12"

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "${HEALTH_URL}" \
              >/dev/null; then
              echo "Development backend is healthy"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 5
          done

          echo
          echo "Development backend health check failed"

          echo
          echo "PM2 status:"
          pm2 status form-backend || true

          echo
          echo "Recent PM2 logs:"
          pm2 logs form-backend \
            --lines 100 \
            --nostream \
            || true

          echo
          echo "Port 5000 status:"

          if command -v ss >/dev/null 2>&1; then
            ss -lntp | grep ':5000' || true
          elif command -v netstat >/dev/null 2>&1; then
            netstat -lntp | grep ':5000' || true
          fi

          exit 1
          EOF

      - name: Prepare frontend directory
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "${HOME}/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "${SSH_USER}@${FRONTEND_HOST}" \
            "mkdir -p /var/www/html"

      - name: Deploy frontend
        shell: bash
        run: |
          set -euo pipefail

          rsync \
            --archive \
            --compress \
            --delete \
            --exclude='.git/' \
            -e "ssh -i ${HOME}/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10" \
            frontend/ \
            "${SSH_USER}@${FRONTEND_HOST}:/var/www/html/"

      - name: Frontend health check
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 6); do
            echo "Frontend health-check attempt ${attempt}/6"

            if curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --max-time 10 \
              "http://${FRONTEND_HOST}/" \
              >/dev/null; then
              echo "Development frontend is healthy"
              exit 0
            fi

            echo "Waiting for frontend..."
            sleep 5
          done

          echo "Development frontend health check failed"
          exit 1