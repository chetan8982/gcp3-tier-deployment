name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: node --check server.js

      - name: Run tests
        run: npm test --if-present

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$BACKEND_HOST" >> ~/.ssh/known_hosts
          ssh-keyscan -H "$FRONTEND_HOST" >> ~/.ssh/known_hosts

      - name: Create backend environment file
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}
        run: |
          cat > backend/.env <<EOF
          NODE_ENV=production
          PORT=5000
          MONGODB_URI=${MONGODB_URI}
          ALLOWED_ORIGINS=http://${FRONTEND_HOST}
          EOF

      - name: Configure frontend API URL
        env:
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
        run: |
          sed -i \
            "s|const API_URL = .*|const API_URL = \"http://${BACKEND_HOST}:5000/api/forms\";|" \
            frontend/script.js

      - name: Deploy backend
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
        run: |
          rsync -az \
            --delete \
            --exclude node_modules \
            --exclude .git \
            -e "ssh -i ~/.ssh/deploy_key" \
            backend/ \
            "${SSH_USER}@${BACKEND_HOST}:/opt/form-backend/"

      - name: Restart backend
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${SSH_USER}@${BACKEND_HOST}" <<'EOF'
              set -e
              cd /opt/form-backend

              npm ci --omit=dev

              if pm2 describe form-backend >/dev/null 2>&1; then
                pm2 restart form-backend --update-env
              else
                pm2 start server.js --name form-backend
              fi

              pm2 save
          EOF

      - name: Deploy frontend
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}
        run: |
          rsync -az \
            --delete \
            --exclude .git \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend/ \
            "${SSH_USER}@${FRONTEND_HOST}:/var/www/html/"

      - name: Backend health check
        env:
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent \
              "http://${BACKEND_HOST}:5000/" >/dev/null; then
              echo "Production backend is healthy"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 5
          done

          echo "Production backend health check failed"
          exit 1

      - name: Frontend health check
        env:
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}
        run: |
          curl --fail --silent "http://${FRONTEND_HOST}/" >/dev/null
          echo "Production frontend is healthy"